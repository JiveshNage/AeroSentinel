version: "3.8"

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: aerosentinel-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aerosentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aerosentinel}
      POSTGRES_DB: ${POSTGRES_DB:-aerosentinel}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aerosentinel} -d ${POSTGRES_DB:-aerosentinel}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aerosentinel-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aerosentinel-backend
    restart: unless-stopped
    environment:
      APP_NAME: AeroSentinel
      ENVIRONMENT: production
      API_V1_STR: /api
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-aerosentinel}:${POSTGRES_PASSWORD:-aerosentinel}@timescaledb:5432/${POSTGRES_DB:-aerosentinel}
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aerosentinel-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
